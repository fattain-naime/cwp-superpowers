# CWP Vhost Template Examples
# Custom vhost templates for Apache and Nginx

# ===========================================
# Apache Vhost Template (PHP-FPM)
# ===========================================
# Location: /usr/local/cwpsrv/htdocs/resources/conf/web_servers/vhosts/httpd/
# File: custom-phpfpm.conf

<VirtualHost %ip%:8181>
    ServerName %domain%
    ServerAlias www.%domain%
    DocumentRoot %docroot%
    
    <Directory %docroot%>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>
    
    # PHP-FPM Configuration
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/opt/alt/php-fpm81/usr/var/run/%user%.sock|fcgi://localhost"
    </FilesMatch>
    
    # Logging
    ErrorLog /usr/local/apache/logs/%domain%-error.log
    CustomLog /usr/local/apache/logs/%domain%-access.log combined
    
    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    
    # SSL Redirect (if SSL enabled)
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ===========================================
# Nginx Vhost Template (Reverse Proxy)
# ===========================================
# Location: /usr/local/cwpsrv/htdocs/resources/conf/web_servers/vhosts/nginx/
# File: custom-proxy.conf

server {
    listen %ip%:80;
    server_name %domain% www.%domain%;
    
    # Redirect to HTTPS
    # return 301 https://$host$request_uri;
    
    # Root directory
    root %docroot%;
    index index.php index.html;
    
    # Logging
    access_log /var/log/nginx/%domain%-access.log;
    error_log /var/log/nginx/%domain%-error.log;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|tar|gz)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/opt/alt/php-fpm81/usr/var/run/%user%.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Proxy to Apache (if using Nginx->Apache stack)
    # location / {
    #     proxy_pass http://127.0.0.1:8181;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# ===========================================
# Nginx SSL Vhost Template
# ===========================================

server {
    listen %ip%:443 ssl http2;
    server_name %domain% www.%domain%;
    
    root %docroot%;
    index index.php index.html;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/%domain%/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/%domain%/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Logging
    access_log /var/log/nginx/%domain%-ssl-access.log;
    error_log /var/log/nginx/%domain%-ssl-error.log;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'" always;
    
    # Static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|tar|gz)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/opt/alt/php-fpm81/usr/var/run/%user%.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# ===========================================
# Varnish VCL Template
# ===========================================
# Location: /etc/varnish/default.vcl

vcl 4.0;

backend default {
    .host = "127.0.0.1";
    .port = "8181";
    .connect_timeout = 60s;
    .first_byte_timeout = 60s;
    .between_bytes_timeout = 60s;
}

sub vcl_recv {
    # Remove cookies for static files
    if (req.url ~ "\.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|tar|gz)$") {
        unset req.http.Cookie;
        return (hash);
    }
    
    # Pass requests with cookies
    if (req.http.Cookie) {
        return (pass);
    }
    
    return (hash);
}

sub vcl_backend_response {
    # Cache static files for 30 days
    if (bereq.url ~ "\.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|tar|gz)$") {
        set beresp.ttl = 30d;
        unset beresp.http.Set-Cookie;
    }
    
    # Don't cache error pages
    if (beresp.status >= 400) {
        set beresp.ttl = 0s;
    }
}

sub vcl_deliver {
    # Add cache hit/miss header
    if (obj.hits > 0) {
        set resp.http.X-Cache = "HIT";
    } else {
        set resp.http.X-Cache = "MISS";
    }
}
